<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="StreamBox"><meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<title>StreamBox</title>
<style>
:root{--bg:#0a0a0f;--bg2:#14141c;--bg3:#1d1d28;--tx:#f4f4f6;--mu:#9a9aab;--ac:#e50914;--ac2:#ff3b45;--r:12px;--sb:env(safe-area-inset-bottom);--st:env(safe-area-inset-top)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;overscroll-behavior:none}
body{min-height:100vh;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input{font:inherit}
svg{width:1.3em;height:1.3em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
.hide{display:none!important}
/* login */
#login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px 22px calc(28px + var(--sb));max-width:460px;margin:0 auto;background:radial-gradient(120% 60% at 50% 0,#2a0a10 0,transparent 70%)}
.logo{font-weight:900;letter-spacing:.14em;color:var(--ac);font-size:30px;text-align:center;font-family:Arial,sans-serif;margin-bottom:6px}
#login .sub{text-align:center;color:var(--mu);margin:0 0 26px;font-size:14px}
.f{display:block;margin-bottom:14px}.f span{display:block;font-size:13px;color:var(--mu);margin-bottom:6px}
.f input{width:100%;padding:14px 14px;background:var(--bg2);border:1px solid #2b2b3a;border-radius:var(--r);color:var(--tx);font-size:16px;outline:0;direction:ltr;text-align:left;unicode-bidi:isolate;transition:border .2s}
.f input:focus{border-color:var(--ac)}
.f small{display:block;color:#6d6d80;font-size:12px;margin-top:5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 22px;border-radius:var(--r);background:var(--ac);color:#fff;font-weight:700;font-size:16px;transition:transform .15s,background .2s}
.btn:active{transform:scale(.97)}.btn.sec{background:rgba(255,255,255,.14);backdrop-filter:blur(8px)}.btn.blk{width:100%}.btn.ghost{background:none;border:1px solid #333344;color:var(--mu)}
#msg{min-height:22px;margin:4px 0 12px;font-size:14px;color:#ff8a8f;line-height:1.6}
#msg.ok{color:var(--mu)}
/* top bar */
#top{position:fixed;top:0;inset-inline:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:calc(10px + var(--st)) 16px 10px;background:linear-gradient(#0a0a0fee,#0a0a0f00);pointer-events:none}
#top>*{pointer-events:auto}
#top .logo{font-size:20px;margin:0}
#top button{padding:8px;border-radius:50%;background:rgba(0,0,0,.35)}
#app{padding-bottom:calc(90px + var(--sb));min-height:100vh}
.view{animation:fade .28s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
/* tab bar */
#tabs{position:fixed;bottom:0;inset-inline:0;z-index:30;display:flex;background:rgba(14,14,20,.92);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid #23232f;padding:6px 4px calc(6px + var(--sb))}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--mu);padding:4px 0;transition:color .2s}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:#fff}#tabs button.on svg{stroke:var(--ac2)}
/* hero */
#hero{position:relative;height:min(68vh,520px);background:var(--bg3) center/cover no-repeat;display:flex;align-items:flex-end;margin-bottom:6px}
#hero:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg) 4%,#0a0a0f66 45%,#0a0a0f33 70%,#0a0a0faa)}
#hero .in{position:relative;z-index:1;padding:0 18px 22px;width:100%}
#hero h1{margin:0 0 6px;font-size:28px;line-height:1.25;text-shadow:0 2px 12px #000a}
#hero .meta{color:#d0d0da;font-size:13px;margin-bottom:14px;display:flex;gap:10px;flex-wrap:wrap}
#hero .acts{display:flex;gap:10px}
/* rows */
.row{margin:18px 0}
.row h3{margin:0 16px 10px;font-size:18px;font-weight:700;display:flex;justify-content:space-between;align-items:baseline}
.row h3 a{font-size:13px;color:var(--mu);font-weight:400}
.sc{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;-webkit-overflow-scrolling:touch;scrollbar-width:none;scroll-snap-type:x proximity}
.sc::-webkit-scrollbar{display:none}
.c{flex:0 0 auto;width:118px;scroll-snap-align:start;cursor:pointer;position:relative;transition:transform .18s}
.c:active{transform:scale(.96)}
.c .p{position:relative;aspect-ratio:2/3;border-radius:10px;overflow:hidden;background:linear-gradient(155deg,hsl(var(--h) 55% 28%),hsl(calc(var(--h) + 40) 60% 14%));display:flex;align-items:flex-end;box-shadow:0 4px 14px #0008}
.c .p span{padding:8px;font-size:12px;font-weight:700;line-height:1.3;opacity:.9;word-break:break-word}
.c .p img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#111;animation:fade .35s}
.c small{display:block;margin-top:6px;font-size:12px;color:#c9c9d3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c.live{width:150px}.c.live .p{aspect-ratio:16/10;align-items:center;justify-content:center}
.c.live .p img{object-fit:contain;padding:14px;background:transparent}
.c.live .p span{position:absolute;bottom:0;inset-inline:0;background:#0009}
.c.live .p img+*{display:none}
.pb{position:absolute;bottom:22px;inset-inline:0;height:3px;background:#0008}.pb i{display:block;height:100%;background:var(--ac)}
.badge{position:absolute;top:6px;inset-inline-start:6px;background:var(--ac);font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;letter-spacing:.05em}
.fv{position:absolute;top:4px;inset-inline-end:4px;font-size:11px;background:#000a;border-radius:6px;padding:2px 5px;color:#ffd23f}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:14px 10px;padding:0 16px}
.grid .c{width:auto}.grid .c.live{width:auto}
.pad{height:calc(64px + var(--st))}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 12px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:7px 14px;border-radius:99px;background:var(--bg2);border:1px solid #2a2a38;font-size:13px;color:#c9c9d3;transition:all .2s}
.chip.on{background:#fff;color:#000;border-color:#fff;font-weight:700}
.h2{margin:6px 16px 14px;font-size:24px;font-weight:800}
.empty{padding:70px 28px;text-align:center;color:var(--mu);line-height:1.9}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.sk{height:170px;margin:14px 16px;border-radius:12px;background:linear-gradient(100deg,#14141c 30%,#1f1f2b 50%,#14141c 70%);background-size:200% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-200% 0}}
.more{display:block;margin:18px auto;padding:11px 26px}
/* search */
.sbox{margin:0 16px 16px;display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid #2a2a38;border-radius:14px;padding:0 12px}
.sbox input{flex:1;background:none;border:0;outline:0;color:var(--tx);padding:14px 4px;font-size:16px}
/* sheet */
#sheet{position:fixed;inset:0;z-index:50;background:rgba(0,0,0,.6);opacity:0;pointer-events:none;transition:opacity .25s}
#sheet.on{opacity:1;pointer-events:auto}
#sheet .box{position:absolute;bottom:0;inset-inline:0;max-width:760px;margin:0 auto;max-height:92vh;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;transform:translateY(100%);transition:transform .32s cubic-bezier(.2,.8,.2,1);padding-bottom:calc(24px + var(--sb))}
#sheet.on .box{transform:none}
.bd{height:210px;background:var(--bg3) center/cover;position:relative;border-radius:20px 20px 0 0}
.bd:after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,var(--bg),transparent 70%)}
.x{position:absolute;top:12px;inset-inline-start:12px;z-index:2;background:#000a;border-radius:50%;padding:8px}
.dt{padding:0 18px;margin-top:-34px;position:relative;z-index:1}
.dt h2{margin:0 0 8px;font-size:23px;line-height:1.3}
.dt .meta{display:flex;flex-wrap:wrap;gap:10px;color:var(--mu);font-size:13px;margin-bottom:14px}
.dt .meta b{color:#ffd23f}
.dt .plot{color:#cfcfd9;line-height:1.85;font-size:14px;margin:14px 0}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.sea{display:flex;gap:8px;overflow-x:auto;margin:20px 0 10px;scrollbar-width:none}
.ep{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;background:var(--bg2);margin-bottom:8px;cursor:pointer;position:relative;overflow:hidden}
.ep:active{background:var(--bg3)}
.ep .n{flex:0 0 36px;height:36px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
.ep .t{flex:1;font-size:14px;line-height:1.5}.ep .t small{display:block;color:var(--mu);font-size:12px}
.ep .pb{bottom:0}
.epg{margin-top:14px}.epg div{padding:9px 0;border-bottom:1px solid #1f1f2b;font-size:13px;color:#cfcfd9}.epg small{color:var(--mu);display:block}
/* player */
#player{position:fixed;inset:0;z-index:100;background:#000;display:none;flex-direction:column}
#player.on{display:flex;animation:fade .25s}
#player video{flex:1;width:100%;min-height:0;background:#000}
#pbar{position:absolute;top:0;inset-inline:0;display:flex;align-items:center;gap:10px;padding:calc(10px + var(--st)) 12px 22px;background:linear-gradient(#000c,transparent);transition:opacity .3s;z-index:2}
#pbar .tt{flex:1;min-width:0}#pbar b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}#pbar small{color:#bbb;font-size:12px}
#pbar button{padding:9px;border-radius:50%;background:#0008;display:flex}
#pctl{position:absolute;bottom:calc(64px + var(--sb));inset-inline:0;display:flex;justify-content:center;gap:16px;transition:opacity .3s;z-index:2;pointer-events:none}
#pctl button{pointer-events:auto;padding:10px 16px;border-radius:99px;background:#000a;font-size:14px;font-weight:700;display:flex;align-items:center;gap:6px}
#player.idle #pbar,#player.idle #pctl{opacity:0;pointer-events:none}
#perr{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:30px;line-height:1.9;color:#ddd;pointer-events:none;flex-direction:column;gap:14px}#perr a{pointer-events:auto;display:block;background:#e50914;color:#fff;text-decoration:none;font-weight:700;padding:12px 26px;border-radius:10px;min-width:210px}#perr a.b2{background:#2a2a2a}
#spin{position:absolute;top:50%;left:50%;width:42px;height:42px;margin:-21px;border:3px solid #fff3;border-top-color:#fff;border-radius:50%;animation:rot .8s linear infinite;pointer-events:none}
@keyframes rot{to{transform:rotate(360deg)}}
#toast{position:fixed;bottom:calc(90px + var(--sb));left:50%;transform:translate(-50%,20px);background:#fff;color:#000;padding:10px 18px;border-radius:99px;font-size:14px;font-weight:700;z-index:200;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.set{margin:0 16px}.set .it{display:flex;justify-content:space-between;align-items:center;padding:15px 16px;background:var(--bg2);border-radius:12px;margin-bottom:8px;font-size:15px}
.set .it span{color:var(--mu);font-size:13px;direction:ltr}
.set button.it{width:100%;text-align:start}.set .dng{color:#ff6b72}
@media(min-width:700px){.c{width:150px}.c.live{width:190px}.grid{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}#hero h1{font-size:40px}#hero .in{padding:0 40px 30px}.row h3,.h2{margin-inline:40px}.sc,.grid,.chips{padding-inline:40px}}
html,body{overflow-x:hidden;max-width:100%}#hero h1,.dt h2,.h2,.row h3,.ep .t,#pbar b{overflow-wrap:anywhere;word-break:break-word}#hero h1{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}#hero .in{min-width:0}#hero,#app,.view{max-width:100vw}i.rs{color:#ff6b73;font-style:normal;font-weight:700;margin-inline-start:6px}.ep.has{outline:1px solid #e5091466}
#cw{margin:calc(64px + var(--st)) 0 6px}#cw h3{font-size:17px;margin:0 16px 8px}.cws{display:flex;gap:10px;overflow-x:auto;padding:0 14px 6px;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch}.cws::-webkit-scrollbar{display:none}
.cwc{flex:0 0 auto;width:min(86vw,310px);scroll-snap-align:start;display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;background:linear-gradient(120deg,#e50914,#8a0b12);color:#fff;box-shadow:0 6px 24px #e5091430;cursor:pointer}
.cwc .th{width:56px;height:56px;border-radius:12px;background:#0006 center/cover;flex:none;display:flex;align-items:center;justify-content:center;font-size:24px}
.cwc .tx{flex:1;min-width:0}.cwc b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cwc small{display:block;opacity:.92;margin-top:2px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cwc .pr{height:4px;background:#fff4;border-radius:2px;margin-top:7px;overflow:hidden}.cwc .pr i{display:block;height:100%;background:#fff}
.cwc .go{background:#fff;color:#c00;font-weight:800;border-radius:10px;padding:9px 11px;flex:none;font-size:13px}
#pctl{flex-wrap:wrap;gap:8px 10px;padding:0 10px}#pctl .sm{font-size:13px;padding:9px 13px}#lmsg{position:absolute;inset-inline:20px;top:calc(50% + 46px);text-align:center;color:#ccc;font-size:14px;line-height:1.8;pointer-events:none}#lockov{position:absolute;inset:0;z-index:5;display:none;align-items:flex-end;justify-content:center;padding-bottom:calc(40px + env(safe-area-inset-bottom))}
#lockov.on{display:flex}#lockov button{background:#000a;color:#fff;border-radius:22px;padding:11px 20px;font-size:14px}#ac .btn.big{flex:1 1 100%;font-size:16px;padding:15px 18px;box-shadow:0 6px 20px #e5091455}</style></head><body>

<div id="login" class="hide">
 <div class="logo">STREAMBOX</div>
 <p class="sub">سجّل دخولك بحساب الاشتراك لعرض القنوات والأفلام والمسلسلات</p>
 <label class="f"><span>عنوان السيرفر</span><input id="s" dir="ltr" placeholder="http://example.com:8080" autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"><small>انسخه كما هو من مزوّد الخدمة، مع رقم البورت إن وُجد</small></label>

 <label class="f"><span>رابط البروكسي (اختياري)</span><input id="x" dir="ltr" value="https://streambox-proxy.onrender.com/" placeholder="https://..." autocapitalize="off" autocorrect="off" spellcheck="false" inputmode="url"><small>اتركه كما هو. مطلوب لأن السيرفر يعمل بـ HTTP</small></label>

</div>

<script>
const $=id=>document.getElementById(id);
const LS=(k,d)=>{try{const v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},SV=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hue=s=>{let h=0;for(const c of String(s))h=(h*31+c.charCodeAt(0))%360;return h};
const TYPES={live:'القنوات المباشرة',movie:'الأفلام',series:'المسلسلات'};
let C=LS('sb_cfg',null);if(C&&C.v!==2)C=null;
let DEMO=!!(C&&C.demo),D={},ITEMS={},FAV=LS('sb_fav',[]),HIST=LS('sb_hist',{}),LAST=LS('sb_last',null),TL=LS('sb_titles',{}),POS=LS('sb_pos',{}),view='home',catSel={},hls=null,CP=null,lastSave=0,idleT=null;
/* ---------- network ---------- */
const px=u=>C&&C.proxy?C.proxy+(C.proxy.includes('?')?'':'?url=')+encodeURIComponent(u):u;
const imgU=u=>{if(!u)return '';if(!/^https?:/i.test(u))return '';return /^https:/i.test(u)||!(C&&C.proxy)?(/^https:/i.test(u)?u:px(u)):px(u)};
async function api(a,x=''){
 if(DEMO)return demoApi(a,x);
 let res;try{res=await fetch(px(`${C.server}/player_api.php?username=${C.user}&password=${C.pass}${a?'&action='+a:''}${x}`))}catch(e){throw new Error('net')}
 const t=await res.text();try{return JSON.parse(t)}catch(e){const er=new Error('json');er.status=res.status;throw er}
}
function normServer(v){v=(v||'').replace(/[\u200e\u200f\u202a-\u202e\s]/g,'');if(!v)return '';if(!/^https?:\/\//i.test(v))v='http://'+v;return v.replace(/\/(player_api|get|panel_api|xmltv)\.php.*$/i,'').replace(/[?#].*$/,'').replace(/\/+$/,'')}
function errText(e){if(e.message==='net')return 'تعذّر الوصول إلى السيرفر. تأكد من العنوان والإنترنت، ولو العنوان يبدأ بـ http فأضف رابط البروكسي.';if(e.message==='json')return `السيرفر لم يردّ بالشكل المتوقع (رمز ${e.status||'؟'}). راجع عنوان السيرفر والبورت بالضبط كما أعطاك مزوّد الخدمة.`;return e.message||'حدث خطأ غير متوقع'}
/* ---------- login ---------- */
function showLogin(){['top','tabs'].forEach(i=>$(i).classList.add('hide'));$('app').innerHTML='';$('login').classList.remove('hide');if(C&&C.server)$('s').value=C.server}

 const s=normServer($('s').value),u=$('u').value.trim(),p=$('p').value.trim(),x=$('x').value.trim().replace(/\s/g,'');

function lazyRows(d,t){
